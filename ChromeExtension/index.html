<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Destacar Título</title>
    <script src="app.js" defer></script>
    <style>
        body {
            width: 180px;
            height: 100px;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

            button:hover {
                background: #0056b3;
            }
    </style>
</head>
<body>
    <button id="highlightBtn">Start</button>
    <button id="pauseBtn">Pause</button>
    <button id="continueBtn">Continue</button>
    <button id="saveBtn">Save</button>
</body>
</html>
